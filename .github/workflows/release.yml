name: Release candidate

on:
  push:
    tags:
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing four-component release tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qcontrol-release
  cancel-in-progress: false

env:
  JPRM_COMMIT: 9497a0a499416cc572ed2e07a391d9f943a37b4d
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  SOURCE_REF: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.tag) }}

jobs:
  validate:
    name: Validate exact tag
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - name: Verify exact clean tag checkout
        id: source
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          git show-ref --verify "${tag_ref}"
          source_commit="$(git rev-parse HEAD)"
          test "${source_commit}" = "$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${source_commit}" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          fi
          test -z "$(git status --porcelain)"
          mkdir -p release-bundle
          printf '%s\n' "${source_commit}" >release-bundle/source-commit.txt
          printf 'commit=%s\n' "${source_commit}" >>"${GITHUB_OUTPUT}"

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.QControl.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.QControl.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test Jellyfin.Plugin.QControl.sln --configuration Release --no-build --no-restore --verbosity normal
          node --check --experimental-default-type=module Jellyfin.Plugin.QControl/Configuration/configPage.js
          node --test --experimental-default-type=module tests/ui/configPage.test.js
          tests/release/release-tooling.test.sh

      - name: Build plugin package
        id: package
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: net9.0

      - name: Prepare immutable candidate assets
        id: assets
        run: |
          mkdir -p release-bundle/release-assets
          release_package="$(scripts/prepare-release-assets.sh \
            "${RELEASE_TAG}" \
            "${{ steps.package.outputs.artifact }}" \
            release-bundle/release-assets | tail -n 1)"
          asset_name="$(basename -- "${release_package}")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          {
            printf 'package=%s\n' "${release_package}"
            printf 'asset-url=%s\n' "${asset_url}"
          } >>"${GITHUB_OUTPUT}"

      - name: Install pinned JPRM for manifest generation
        run: |
          python3 -m venv "${RUNNER_TEMP}/jprm"
          "${RUNNER_TEMP}/jprm/bin/pip" install \
            --disable-pip-version-check \
            "git+https://github.com/oddstr13/jellyfin-plugin-repository-manager.git@${JPRM_COMMIT}"
          printf 'JPRM=%s\n' "${RUNNER_TEMP}/jprm/bin/jprm" >>"${GITHUB_ENV}"

      - name: Generate and verify candidate manifest
        env:
          ASSET_URL: ${{ steps.assets.outputs.asset-url }}
          PACKAGE: ${{ steps.assets.outputs.package }}
        run: |
          mkdir -p release-bundle/candidate-manifest
          "${JPRM}" repo init release-bundle/candidate-manifest
          "${JPRM}" repo add \
            --plugin-url "${ASSET_URL}" \
            release-bundle/candidate-manifest \
            "${PACKAGE}"
          scripts/verify-release-contract.sh \
            "${RELEASE_TAG}" \
            "${PACKAGE}" \
            release-bundle/candidate-manifest/manifest.json \
            "${ASSET_URL}"

      - name: Prepare release notes
        run: |
          notes_file="docs/releases/${RELEASE_TAG}-alpha.md"
          test -f "${notes_file}"
          install -m 0644 "${notes_file}" release-bundle/release-notes.md

      - name: Upload validated candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: qcontrol-release-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 7
          path: release-bundle

  draft:
    name: Create draft prerelease
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source-commit }}

      - name: Download validated candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qcontrol-release-${{ env.RELEASE_TAG }}
          path: release-bundle

      - name: Reject a moved release tag
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.source-commit }}
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          git show-ref --verify "${tag_ref}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse "${tag_ref}^{commit}")" = "${EXPECTED_COMMIT}"

      - name: Create draft prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'A release already exists for %s; refusing to alter it.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "QControl ${version} alpha" \
            --notes-file release-bundle/release-notes.md \
            release-bundle/release-assets/*
